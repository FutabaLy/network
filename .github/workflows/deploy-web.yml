name: 部署各项目网页实时版到 GitHub Pages

# 一个仓库一个站点：根是门户页（按 projects.json 生成），每个项目挂在 dist/<项目目录>/ 下。
# 所以以后新增片子只要加目录 + 在 projects.json 里加一条，URL 就是 /network/<项目目录>/。

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'projects.json'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/*/package-lock.json

      - name: 安装依赖并校验各项目（类型检查 + 数值自检）
        run: |
          for p in projects/*/; do
            echo "=== $p ==="
            (cd "$p" && npm ci && npm run check)
          done

      - name: 构建并组装 Pages 产物（门户页 + 各项目子路径）
        run: node scripts/build-pages.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
